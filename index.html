<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>xG Overdue Live</title><style>
:root{--bg:#07090d;--card:#11151c;--line:#1f2630;--t:#e8edf3;--m:#8a96a6;--g:#22c55e;--a:#f59e0b}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font:15px/1.4 system-ui,Segoe UI,Roboto,sans-serif}
header{padding:22px 20px;background:linear-gradient(90deg,#0f3d22,#07090d);border-bottom:1px solid var(--line)}
h1{margin:0;font-size:24px;letter-spacing:.5px}h1 b{color:var(--g)}.sub{color:var(--m);font-size:13px;margin-top:4px}
main{max-width:1100px;margin:auto;padding:16px}.bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.bar button{background:var(--card);color:var(--t);border:1px solid var(--line);padding:7px 14px;border-radius:8px;cursor:pointer}
.bar button.on{border-color:var(--g);color:var(--g)}
table{width:100%;border-collapse:collapse;background:var(--card);border-radius:12px;overflow:hidden}
th{background:#0b0e13;color:var(--m);font-weight:600;font-size:12px;text-transform:uppercase;padding:10px 8px;text-align:center}
td{padding:11px 8px;border-top:1px solid var(--line);text-align:center;white-space:nowrap}td.l{text-align:left}
.ov{font-weight:700;border-radius:6px;padding:3px 10px;display:inline-block;min-width:30px}
.ov.p{background:var(--g);color:#04130a}.ov.z{background:#2a313c;color:var(--m)}
.lg{color:var(--m);font-size:12px}.ft{color:var(--a);font-weight:600}.empty{padding:30px;text-align:center;color:var(--m)}
footer{color:var(--m);font-size:12px;text-align:center;padding:20px}
</style></head><body>
<header><h1>⚽ xG <b>OVERDUE</b> LIVE</h1><div class="sub" id="upd">Caricamento…</div></header>
<main><div class="bar"><button data-f="ok" class="on">Solo da metodo</button><button data-f="all">Tutte</button>
<button data-m="45" class="on">45'</button><button data-m="65">65'</button></div>
<table><thead><tr><th class="l">Partita</th><th>Min</th><th>Ris.</th><th>xG</th><th>Proiez.</th><th>xSxG</th><th>Tot. Overdue</th><th>Esito</th><th>Finale</th></tr></thead>
<tbody id="tb"></tbody></table></main>
<footer>Dati FotMob · aggiornamento ogni ~10 min · solo a scopo di studio, nessuna garanzia</footer>
<script>
let D={matches:{}},F="ok",M=45;const f=n=>Number(n).toFixed(2);
document.querySelectorAll("[data-f],[data-m]").forEach(b=>b.onclick=()=>{const k=b.dataset.f?"f":"m";
document.querySelectorAll(`[data-${k}]`).forEach(x=>x.classList.remove("on"));b.classList.add("on");
if(b.dataset.f)F=b.dataset.f;else M=+b.dataset.m;draw()});
function draw(){const r=Object.values(D.matches).filter(m=>m.minuto==M&&(F=="all"||m.totale>0)).sort((a,b)=>b.totale-a.totale);
document.getElementById("tb").innerHTML=r.length?r.map(m=>`<tr><td class="l"><div class="lg">${m.campionato}</div>${m.casa} – ${m.ospite}</td>
<td>${m.minuto}'</td><td><b>${m.punteggio_live}</b></td><td>${f(m.xg[0])} – ${f(m.xg[1])}</td><td>${f(m.proj[0])} – ${f(m.proj[1])}</td>
<td>${f(m.xsxg[0])} / ${f(m.xsxg[1])}</td><td><span class="ov ${m.totale>0?"p":"z"}">${m.totale}</span></td><td>${m.esito}</td>
<td class="ft">${m.finale||"—"}</td></tr>`).join(""):`<tr><td colspan=9 class="empty">Nessuna partita al momento</td></tr>`}
async function load(){try{D=await (await fetch("data.json?t="+Date.now())).json();
document.getElementById("upd").textContent="Ultimo aggiornamento: "+(D.aggiornato||"—")}catch(e){document.getElementById("upd").textContent="Dati non disponibili"}draw()}
load();setInterval(load,60000);
</script></body></html>
